[package]
name = "up-wire-omgidl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Strict OMG IDL XCDR1 little-endian selected-wire codec for Eclipse uProtocol"
readme = "README.md"
include = [
    "/benches/**",
    "/docs/**",
    "/idl/**",
    "/src/**",
    "/tests/**",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
]

[dependencies]
bytes = { version = "1.11.1", default-features = false }
dust_dds = { version = "=0.15.0" }
up-rust = { version = "=0.10.0-SNAPSHOT", git = "https://github.com/PLeVasseur/up-rust.git", rev = "28073370dcb8d75245c57c2a5b5ab54249759146", default-features = false, features = ["selected-wire-user-api", "wire-implementer-api"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[[bench]]
name = "wire_criterion"
harness = false

[lints.rust]
unsafe_code = "forbid"
